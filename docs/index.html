<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>築光 Embright</title>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --text:#1a1d29; --muted:#6b7280; --border:#e6e7ec;
  --primary:#4f46e5; --primary-dark:#3730a3; --primary-soft:#eef0fd;
  --radius:14px; --shadow:0 6px 20px rgba(20,20,50,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Microsoft JhengHei","Noto Sans TC",Inter,sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}
.app{max-width:1100px;margin:0 auto;padding:0 24px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:800;font-size:24px}
.brand .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#f6d365,#c9971f);color:#3b2b06;display:grid;place-items:center;font-size:16px;font-weight:800;box-shadow:0 2px 8px rgba(201,151,31,.35);align-self:center}
.brand .cn{color:var(--text);letter-spacing:1px}
.brand .en{font-size:13px;font-weight:700;letter-spacing:2.5px;color:#b8860b;text-transform:uppercase}
.coin-pill{background:#fff7e0;color:#a16207;font-weight:800;font-size:16px;padding:7px 14px;border-radius:999px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:12px;box-shadow:var(--shadow);margin-bottom:24px}
.tabs button{flex:1;border:0;background:transparent;padding:11px 14px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:700;font-size:17px;transition:.15s}
.tabs button.active{background:var(--primary);color:#fff}
.page{display:none;animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.section-title{font-size:20px;font-weight:800;margin:0 0 14px}
.muted{color:var(--muted);font-size:16px}

/* 儀表板:面向卡片 */
.domain-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.domain-card{border-radius:var(--radius);padding:18px;cursor:pointer;transition:.15s;border:1px solid transparent;position:relative}
.domain-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.domain-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.domain-card .name{font-weight:800;font-size:19px}
.domain-card .count{font-size:16px;opacity:.85}
.order-btns{display:flex;flex-direction:column;gap:2px}
.order-btns button{border:0;background:rgba(255,255,255,.5);width:22px;height:18px;border-radius:5px;cursor:pointer;font-size:13px;line-height:1}
.add-domain-card{border:2px dashed var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;min-height:90px;color:var(--muted);cursor:pointer;font-weight:700}
.add-domain-card:hover{border-color:var(--primary);color:var(--primary)}
.reward-card{background:#fafafd;border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.reward-card .title{font-weight:800;font-size:18px;margin-bottom:6px}
.reward-card .cost{color:#a16207;font-weight:700;font-size:16px;margin-bottom:12px}
.reward-card .row{display:flex;gap:8px}
.reward-card button.redeem:disabled{opacity:.4;cursor:not-allowed}

/* 目標地圖 */
.domain-picker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.domain-pill{border:1px solid var(--border);background:#fff;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:700;font-size:16px;transition:.15s}
.domain-pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.goal-node{border:1px solid var(--border);border-left:4px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.goal-node-long{border-left-color:#7c3aed}
.goal-node-mid{border-left-color:#2563eb}
.goal-node-short{border-left-color:#0d9488}
.level-tag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;margin-right:2px}
.level-tag-long{background:#f1eafe;color:#7c3aed}
.level-tag-mid{background:#e6f0ff;color:#2563eb}
.level-tag-short{background:#e2f6f2;color:#0d9488}
.goal-date{font-size:13px;color:var(--muted);white-space:nowrap}
.goal-row{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.goal-row:hover{background:#fafafd}
.goal-row .caret{width:16px;color:var(--muted);transition:.15s}
.goal-row.open .caret{transform:rotate(90deg)}
.goal-title{font-weight:700;font-size:17px;flex:1}
.goal-badge{font-size:14px;padding:2px 9px;border-radius:999px;font-weight:700}
.badge-progress{background:#eef0fd;color:var(--primary)}
.badge-done{background:#e7f7ec;color:#16a34a}
.goal-children{display:none;padding:4px 14px 14px 34px;border-top:1px solid var(--border)}
.goal-children.open{display:block}
.add-inline{display:flex;gap:8px;margin-top:8px}
.add-inline input,.add-inline select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:16px}
.add-inline input[type=text]{flex:1}
.btn{border:0;border-radius:9px;padding:8px 14px;background:var(--primary);color:#fff;cursor:pointer;font-weight:700;font-size:16px;transition:.15s}
.btn:hover{background:var(--primary-dark)}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn.small{padding:5px 10px;font-size:15px}
.task-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:16px}
.task-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary);cursor:pointer}
.task-row.done span{text-decoration:line-through;color:var(--muted)}

/* 今日任務 */
.today-item{display:flex;align-items:center;gap:12px;padding:13px 6px;border-bottom:1px solid var(--border)}
.today-item:last-child{border-bottom:0}
.today-item input[type=checkbox]{width:19px;height:19px;accent-color:var(--primary);cursor:pointer}
.today-item .info{flex:1}
.today-item .info .title{font-weight:700;font-size:17px}
.today-item .info .path{font-size:15px;color:var(--muted);margin-top:2px}
.today-item.done .title{text-decoration:line-through;color:var(--muted)}

/* 完成紀錄 */
.log-table{width:100%;border-collapse:collapse;font-size:16px}
.log-table th,.log-table td{padding:11px 8px;border-bottom:1px solid var(--border);text-align:left}
.log-table th{color:var(--muted);font-weight:700;font-size:15px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:14px;font-weight:700}

.empty{text-align:center;color:var(--muted);padding:36px 0;font-size:16px}
.toast{position:fixed;right:22px;bottom:22px;background:#1a1d29;color:#fff;padding:12px 18px;border-radius:10px;display:none;box-shadow:var(--shadow);font-size:16px;z-index:50}
.modal-mask{position:fixed;inset:0;background:rgba(20,20,40,.35);display:none;align-items:center;justify-content:center;z-index:40}
.modal-mask.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:22px;width:340px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal h3{margin:0 0 14px;font-size:19px}
.modal .field{margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:15px;color:var(--muted);margin-bottom:5px;font-weight:700}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:17px;color:var(--text);background:#fff;box-sizing:border-box}
.field input::placeholder{color:#b0b2ba}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary)}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.color-picks{display:flex;gap:8px}
.color-picks span{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.color-picks span.selected{border-color:#1a1d29}

/* 登入/註冊畫面 */
.auth-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:
    radial-gradient(circle at 20% 15%, rgba(246,211,101,.16), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(201,151,31,.14), transparent 50%),
    linear-gradient(155deg,#161a2e 0%,#1d2340 45%,#151a30 100%);
  position:relative;overflow:hidden
}
.auth-screen::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);
  background-size:26px 26px;
  mask-image:radial-gradient(circle at 50% 40%, rgba(0,0,0,.9), transparent 75%);
}
.auth-card{position:relative;z-index:1;box-shadow:0 24px 60px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.15)}
.auth-card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:32px;width:100%;max-width:360px}
.auth-tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:18px}
.auth-tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:700;font-size:16px}
.auth-tabs button.active{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.auth-error{background:#fde8e8;color:#dc2626;font-size:15px;padding:9px 12px;border-radius:8px;margin-bottom:10px}

/* 新手導覽:聚光燈效果 */
.tour-backdrop{position:fixed;inset:0;background:rgba(15,15,25,.55);z-index:60;display:none}
.tour-backdrop.open{display:block}
.tour-spotlight{position:fixed;z-index:61;border-radius:10px;box-shadow:0 0 0 9999px rgba(15,15,25,.55);pointer-events:none;transition:all .25s ease;display:none}
.tour-spotlight.open{display:block}
.tour-card{position:fixed;z-index:62;background:#fff;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);padding:20px;width:300px;display:none}
.tour-card.open{display:block}
.tour-step-label{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:6px}
.tour-card h3{margin:0 0 8px;font-size:19px}
.tour-card p{font-size:16px;line-height:1.6;color:var(--muted);margin:0 0 14px}
.tour-arrow{position:absolute;width:14px;height:14px;background:#fff;transform:rotate(45deg)}
</style>
</head>
<body>
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="brand" style="justify-content:center;margin-bottom:6px"><span class="dot">光</span><span class="cn">築光</span><span class="en">Embright</span></div>
    <p class="muted" style="text-align:center;margin:0 0 20px">把每天的小事,堆成想要的光</p>

    <div class="auth-tabs">
      <button id="authTabLogin" class="active" onclick="switchAuthTab('login')">登入</button>
      <button id="authTabRegister" onclick="switchAuthTab('register')">註冊</button>
    </div>

    <div class="field">
      <label>帳號</label>
      <input type="text" id="authUsername" placeholder="3~20個字元" autocomplete="username">
    </div>
    <div class="field">
      <label>密碼</label>
      <input type="password" id="authPassword" placeholder="至少6個字元" autocomplete="current-password">
    </div>
    <div id="authError" class="auth-error" style="display:none"></div>
    <button class="btn" id="authSubmitBtn" style="width:100%;margin-top:8px" onclick="submitAuth()">登入</button>
    <p class="muted" style="text-align:center;margin-top:14px;font-size:15px">示範帳號:demo / demo1234</p>
  </div>
</div>

<div class="app" id="appRoot" style="display:none">
  <div class="topbar">
    <div class="brand"><span class="dot">光</span><span class="cn">築光</span><span class="en">Embright</span></div>
    <div style="display:flex;align-items:center;gap:14px">
      <span class="coin-pill" id="coinPill">🪙 -- 枚</span>
      <span class="muted" id="todayLabel"></span>
      <button class="btn ghost small" onclick="openTour()" title="重新查看新手導覽">？</button>
      <span class="muted" id="usernameLabel" style="font-weight:700"></span>
      <button class="btn ghost small" onclick="logout()">登出</button>
    </div>
  </div>

  <div class="tabs">
    <button class="active" data-page="dashboard">儀表板</button>
    <button data-page="goalmap">目標地圖</button>
    <button data-page="today">今日任務</button>
    <button data-page="history">完成紀錄</button>
    <button data-page="rewards">獎勵中心</button>
  </div>

  <!-- 儀表板 -->
  <section id="dashboard" class="page active">
    <div class="card" style="margin-bottom:14px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <p class="section-title" style="margin:0">今日簽到</p>
        <p class="muted" style="margin:4px 0 0">每天簽到可以拿 10 枚金幣</p>
      </div>
      <button class="btn" id="checkinBtn" onclick="doCheckin()">簽到 +10</button>
    </div>
    <div class="card">
      <p class="section-title">面向總覽</p>
      <div id="domainGrid" class="domain-grid"></div>
    </div>
  </section>

  <!-- 目標地圖 -->
  <section id="goalmap" class="page">
    <div class="card">
      <p class="section-title">目標地圖</p>
      <div id="domainPicker" class="domain-picker"></div>
      <div id="goalTree"></div>
      <div id="addLongGoalForm"></div>
    </div>
  </section>

  <!-- 今日任務 -->
  <section id="today" class="page">
    <div class="card">
      <p class="section-title">今日任務</p>
      <div id="todayList"></div>
    </div>
  </section>

  <!-- 完成紀錄 -->
  <section id="history" class="page">
    <div class="card">
      <p class="section-title">完成紀錄</p>
      <table class="log-table">
        <thead><tr><th>完成日期</th><th>類型</th><th>面向</th><th>目標</th><th>任務</th></tr></thead>
        <tbody id="logBody"></tbody>
      </table>
      <div id="logEmpty"></div>
    </div>
  </section>

  <!-- 獎勵中心 -->
  <section id="rewards" class="page">
    <div class="card" style="margin-bottom:14px">
      <p class="section-title">兌換獎勵</p>
      <div id="rewardGrid" class="domain-grid"></div>
      <div class="add-inline" style="margin-top:14px">
        <input type="text" id="rewardTitleInput" placeholder="新增獎勵,例如:追一集喜歡的劇">
        <input type="number" id="rewardCostInput" placeholder="所需金幣" min="1" style="width:110px">
        <button class="btn small" onclick="submitNewReward()">新增</button>
      </div>
    </div>
    <div class="card">
      <p class="section-title">金幣紀錄</p>
      <table class="log-table">
        <thead><tr><th>時間</th><th>項目</th><th>金幣</th><th>備註</th></tr></thead>
        <tbody id="coinLogBody"></tbody>
      </table>
      <div id="coinLogEmpty"></div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<div class="modal-mask" id="domainModalMask">
  <div class="modal">
    <h3>新增面向</h3>
    <div class="field">
      <label>面向名稱</label>
      <input type="text" id="domainNameInput" placeholder="例如:工作、學習、家庭、生活">
    </div>
    <div class="field">
      <label>顏色</label>
      <div class="color-picks" id="colorPicks"></div>
    </div>
    <div class="actions">
      <button class="btn ghost small" onclick="closeDomainModal()">取消</button>
      <button class="btn small" onclick="submitNewDomain()">新增</button>
    </div>
  </div>
</div>

<div class="tour-backdrop" id="tourBackdrop"></div>
<div class="tour-spotlight" id="tourSpotlight"></div>
<div class="tour-card" id="tourCard">
  <div class="tour-arrow" id="tourArrow"></div>
  <div class="tour-step-label" id="tourStepLabel">1 / 6</div>
  <h3 id="tourTitle"></h3>
  <p id="tourBody"></p>
  <div class="actions" style="justify-content:space-between">
    <button class="btn ghost small" onclick="skipTour()">跳過</button>
    <div style="display:flex;gap:8px">
      <button class="btn ghost small" id="tourPrevBtn" onclick="tourPrev()">上一步</button>
      <button class="btn small" id="tourNextBtn" onclick="tourNext()">下一步</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 設定區:前端呼叫的後端 API 網址
// 本機開發如果要接本機的 Spring Boot,改成 http://localhost:8080/api
// 目前這裡固定指向 Railway 上部署好的正式後端網址
// ============================================================
const API_BASE = 'https://embright-production.up.railway.app/api';

const DOMAIN_COLORS = {
  accent:  { bg:'#e6f0ff', text:'#1d4ed8' },
  pro:     { bg:'#f1eafe', text:'#7c3aed' },
  success: { bg:'#e7f7ec', text:'#16a34a' },
  warning: { bg:'#fef3e2', text:'#d97706' },
  danger:  { bg:'#fde8e8', text:'#dc2626' },
  teal:    { bg:'#e2f6f2', text:'#0d9488' },
};
const COLOR_KEYS = Object.keys(DOMAIN_COLORS);

let state = {
  domains: [],
  selectedDomainId: null,
};

// ---------- 登入狀態 ----------
let authToken = localStorage.getItem('embright_token');
let authUsername = localStorage.getItem('embright_username');
let authMode = 'login';

// ---------- API 小工具 ----------
async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (authToken) headers['X-Auth-Token'] = authToken;
  const res = await fetch(API_BASE + path, {
    headers,
    ...options,
  });
  const body = await res.json().catch(() => null);
  if (res.status === 401) {
    // token 失效(過期或伺服器重啟被清空),強制回到登入畫面重新登入
    logout();
    throw new Error('登入已過期,請重新登入');
  }
  if (!res.ok || !body || body.success === false) {
    const msg = (body && body.message) || ('連線失敗 (' + res.status + ')');
    throw new Error(msg);
  }
  return body.data;
}
const apiGet = (path) => api(path);
const apiPost = (path, data) => api(path, { method: 'POST', body: JSON.stringify(data) });
const apiPut = (path, data) => api(path, { method: 'PUT', body: JSON.stringify(data) });
const apiPatch = (path) => api(path, { method: 'PATCH' });
const apiDelete = (path) => api(path, { method: 'DELETE' });

function showToast(text, isError) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.style.background = isError ? '#dc2626' : '#1a1d29';
  t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => (t.style.display = 'none'), 2200);
}
function fmtErr(e) { return e && e.message ? e.message : String(e); }

// ---------- 分頁切換 ----------
document.querySelectorAll('.tabs button').forEach((btn) => {
  btn.addEventListener('click', () => switchPage(btn.dataset.page));
});
function switchPage(page) {
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('active', b.dataset.page === page));
  document.querySelectorAll('.page').forEach((p) => p.classList.toggle('active', p.id === page));
  if (page === 'dashboard') loadDashboard();
  if (page === 'goalmap') loadGoalMapPickers();
  if (page === 'today') loadToday();
  if (page === 'history') loadHistory();
  if (page === 'rewards') loadRewards();
}

// ---------- 儀表板 ----------
async function loadDashboard() {
  try {
    state.domains = await apiGet('/domains');
  } catch (e) {
    showToast('讀取面向失敗:' + fmtErr(e), true);
    return;
  }
  const grid = document.getElementById('domainGrid');
  grid.innerHTML = '';
  state.domains.forEach((d, idx) => {
    const c = DOMAIN_COLORS[d.color] || DOMAIN_COLORS.accent;
    const card = document.createElement('div');
    card.className = 'domain-card';
    card.style.background = c.bg;
    card.style.color = c.text;
    card.innerHTML = `
      <div class="head">
        <span class="name">${escapeHtml(d.name)}</span>
        <div class="order-btns">
          <button title="往上移" ${idx === 0 ? 'disabled style="opacity:.3"' : ''} onclick="event.stopPropagation();reorderDomain(${d.id},'UP')">▲</button>
          <button title="往下移" ${idx === state.domains.length - 1 ? 'disabled style="opacity:.3"' : ''} onclick="event.stopPropagation();reorderDomain(${d.id},'DOWN')">▼</button>
        </div>
      </div>
      <div class="count">長期目標 ${d.longGoalCount} 個</div>
    `;
    card.addEventListener('click', () => {
      state.selectedDomainId = d.id;
      switchPage('goalmap');
    });
    grid.appendChild(card);
  });
  const addCard = document.createElement('div');
  addCard.className = 'add-domain-card';
  addCard.textContent = '+ 新增面向';
  addCard.addEventListener('click', openDomainModal);
  grid.appendChild(addCard);
}

async function reorderDomain(id, direction) {
  try {
    await api(`/domains/${id}/order?direction=${direction}`, { method: 'PATCH' });
    loadDashboard();
  } catch (e) {
    showToast('調整順序失敗:' + fmtErr(e), true);
  }
}

// ---------- 新增面向 Modal ----------
let selectedColor = 'accent';
function openDomainModal() {
  const picks = document.getElementById('colorPicks');
  picks.innerHTML = '';
  COLOR_KEYS.forEach((key) => {
    const span = document.createElement('span');
    span.style.background = DOMAIN_COLORS[key].text;
    span.className = key === selectedColor ? 'selected' : '';
    span.onclick = () => { selectedColor = key; openDomainModal(); };

async function renderGoalTree() {

function buildGoalNode(goal, level) {
  const wrap = document.createElement('div');
  const levelClass = { LONG: 'goal-node-long', MID: 'goal-node-mid', SHORT: 'goal-node-short' }[level] || '';
  wrap.className = 'goal-node ' + levelClass;
  wrap.dataset.goalId = goal.id;

  const row = document.createElement('div');
  row.className = 'goal-row';
  renderGoalRowContent(row, goal, level);

  if (goal.status !== 'COMPLETED') {
    const completeBtn = document.createElement('button');
    completeBtn.className = 'btn small ghost';
    completeBtn.textContent = '標記達成 🪙x2';
    completeBtn.style.marginLeft = '6px';
    completeBtn.onclick = async (ev) => {
      ev.stopPropagation();
      try {
        await api(`/goals/${goal.id}/complete`, { method: 'PATCH' });
        showToast('目標已達成,+20 金幣(雙倍獎勵)');
        refreshCoinPill();
        // 只更新這一個節點的樣子(徽章 + 移除按鈕),不整棵樹重畫,
        // 這樣其他已經展開的節點不會跟著被收合(對應你抓到的「點一下全部收起來」問題)
        goal.status = 'COMPLETED';
        renderGoalRowContent(row, goal, level);
        completeBtn.remove();
      } catch (e) {
        showToast('操作失敗:' + fmtErr(e), true);
      }
    };
    row.appendChild(completeBtn);
  }

  const childrenEl = document.createElement('div');
  childrenEl.className = 'goal-children';
  let loaded = false;

  row.addEventListener('click', async () => {
    const isOpen = childrenEl.classList.toggle('open');
    row.classList.toggle('open', isOpen);
    if (isOpen && !loaded) {
      loaded = true;
      await fillChildren(childrenEl, goal, level);
    }
  });

  wrap.appendChild(row);
  wrap.appendChild(childrenEl);
  return wrap;
}

function renderGoalRowContent(row, goal, level) {
  const levelLabel = { LONG: '長期', MID: '中期', SHORT: '短期' }[level] || '';
  const levelTagClass = { LONG: 'level-tag-long', MID: 'level-tag-mid', SHORT: 'level-tag-short' }[level] || '';
  const badge = goal.status === 'COMPLETED'
    ? '<span class="goal-badge badge-done">已達成</span>'
    : '<span class="goal-badge badge-progress">進行中</span>';
  const dateHtml = goal.targetDate ? `<span class="goal-date">到期 ${escapeHtml(goal.targetDate)}</span>` : '';
  row.innerHTML = `
    <span class="caret">${goal.childCount > 0 || level === 'SHORT' ? '▶' : ''}</span>
    <span class="level-tag ${levelTagClass}">${levelLabel}</span>
    <span class="goal-title">${escapeHtml(goal.title)}</span>
    ${dateHtml}
    ${badge}
  `;
}

async function fillChildren(container, goal, level) {
  container.innerHTML = '載入中...';
  if (level === 'SHORT') {
    // 短期目標底下顯示任務清單 + 新增任務表單
    let tasks;
    try {
      tasks = await apiGet(`/tasks?goalId=${goal.id}`);
    } catch (e) {
      container.innerHTML = '讀取任務失敗';
      return;
    }
    container.innerHTML = '';
    if (!tasks.length) {
      const empty = document.createElement('div');
      empty.className = 'muted';
      empty.textContent = '還沒有任務';
      container.appendChild(empty);
    }
    tasks.forEach((t) => container.appendChild(buildTaskRow(t, () => fillChildren(container, goal, level))));
    // 目標已經達成的話,不再顯示新增任務的表單——已經完成的事,不用再往裡面加新任務
    if (goal.status !== 'COMPLETED') {
      container.appendChild(buildAddTaskInline(goal.id, () => fillChildren(container, goal, level)));
    }
    return;
  }

  const nextType = level === 'LONG' ? 'MID' : 'SHORT';
  let children;
  try {
    children = await apiGet(`/goals/${goal.id}/children`);
  } catch (e) {
    container.innerHTML = '讀取子目標失敗';
    return;
  }
  container.innerHTML = '';
  if (!children.length) {
    const empty = document.createElement('div');
    empty.className = 'muted';
    empty.style.marginBottom = '8px';
    empty.textContent = level === 'LONG' ? '還沒有中期目標' : '還沒有短期目標';
    container.appendChild(empty);
  }
  children.forEach((c) => container.appendChild(buildGoalNode(c, nextType)));
  // 目標已經達成的話,不再顯示新增子目標的表單
  if (goal.status !== 'COMPLETED') {
    container.appendChild(buildAddGoalInline(nextType, goal.id, async () => {
      container.innerHTML = '';
      await fillChildren(container, goal, level);
    }, goal.domainId));
  }
}

function buildTaskRow(task, onChange) {
  const row = document.createElement('div');
  row.className = 'task-row' + (task.completed ? ' done' : '');
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = task.completed;
  cb.addEventListener('change', async () => {
    try {
      if (cb.checked) {
        await apiPatch(`/tasks/${task.id}/complete`);
        showToast('已完成,紀錄已寫入');
        refreshCoinPill();
      } else {
        await apiPatch(`/tasks/${task.id}/uncomplete`);
        showToast('已取消,金幣已收回');
        refreshCoinPill();
      }
      onChange();
    } catch (e) {
      showToast('操作失敗:' + fmtErr(e), true);
      cb.checked = !cb.checked;
    }
  });
  const span = document.createElement('span');
  span.textContent = `${task.title}（${freqLabel(task.frequency)}・${task.taskDate}）`;
  row.appendChild(cb);
  row.appendChild(span);
  return row;
}

function freqLabel(f) {
  return { DAILY: '每日', WEEKLY: '每週', ONE_TIME: '一次性' }[f] || f;
}

function buildAddGoalInline(type, parentId, onAdded, domainIdOverride) {
  const wrap = document.createElement('div');
  wrap.className = 'add-inline';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = type === 'LONG' ? '新增長期目標...' : type === 'MID' ? '新增中期目標...' : '新增短期目標...';
  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  const btn = document.createElement('button');
  btn.className = 'btn small';
  btn.textContent = '新增';
  btn.onclick = async () => {
    const title = input.value.trim();
    if (!title) { showToast('請輸入標題', true); return; }
    try {
      await apiPost('/goals', {
        domainId: domainIdOverride || state.selectedDomainId,
        parentId: parentId,
        type: type,
        title: title,
        targetDate: dateInput.value || null,
      });
      input.value = '';
      showToast('目標已新增');
      onAdded();
    } catch (e) {
      showToast('新增失敗:' + fmtErr(e), true);
    }
  };
  wrap.appendChild(input);
  wrap.appendChild(dateInput);
  wrap.appendChild(btn);
  return wrap;
}

function buildAddTaskInline(goalId, onAdded) {
  const wrap = document.createElement('div');
  wrap.className = 'add-inline';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = '新增任務...';
  const freq = document.createElement('select');
  ['DAILY', 'WEEKLY', 'ONE_TIME'].forEach((f) => {
    const opt = document.createElement('option');
    opt.value = f; opt.textContent = freqLabel(f);
    freq.appendChild(opt);
  });
  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  dateInput.value = todayLocalISO();
  const btn = document.createElement('button');
  btn.className = 'btn small';
  btn.textContent = '新增';
  btn.onclick = async () => {
    const title = input.value.trim();
    if (!title) { showToast('請輸入任務標題', true); return; }
    try {
      await apiPost('/tasks', { goalId, title, frequency: freq.value, taskDate: dateInput.value });
      input.value = '';
      showToast('任務已新增');
      onAdded();
    } catch (e) {
      showToast('新增失敗:' + fmtErr(e), true);
    }
  };
  wrap.appendChild(input);
  wrap.appendChild(freq);
  wrap.appendChild(dateInput);
  wrap.appendChild(btn);
  return wrap;
}

// ---------- 小工具 ----------
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 取得瀏覽器「本地時區」的今天日期(yyyy-mm-dd),不能用 new Date().toISOString(),
// 因為 toISOString() 回傳的是 UTC 時間——在台灣時間凌晨0點到早上8點之間,
// UTC 的日期還停留在「昨天」,會跟使用者實際看到的日期差一天
function todayLocalISO() {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

// ---------- 登入 / 註冊 ----------
function switchAuthTab(mode) {
  authMode = mode;
  document.getElementById('authTabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('authTabRegister').classList.toggle('active', mode === 'register');
  document.getElementById('authSubmitBtn').textContent = mode === 'login' ? '登入' : '註冊';
  document.getElementById('authError').style.display = 'none';
}

async function submitAuth() {
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authError');
  errEl.style.display = 'none';

  if (!username || !password) {
    errEl.textContent = '請輸入帳號和密碼';
    errEl.style.display = 'block';
    return;
  }

  const endpoint = authMode === 'login' ? '/auth/login' : '/auth/register';
  try {
    const data = await api(endpoint, { method: 'POST', body: JSON.stringify({ username, password }) });
    authToken = data.token;
    authUsername = data.username;
    localStorage.setItem('embright_token', authToken);
    localStorage.setItem('embright_username', authUsername);
    enterApp();
  } catch (e) {
    errEl.textContent = fmtErr(e);
    errEl.style.display = 'block';
  }
}

function logout() {
  authToken = null;
  authUsername = null;
  localStorage.removeItem('embright_token');
  localStorage.removeItem('embright_username');
  // 清掉上一個帳號留在畫面狀態裡的東西(例如選到哪個面向),避免下一個登入的人看到殘留的選擇
  state.domains = [];
  state.selectedDomainId = null;
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('authUsername').value = '';
  document.getElementById('authPassword').value = '';
}

function enterApp() {
  // 每次進入都重置一次面向選擇狀態,不要沿用其他帳號登入時留下的選擇
  state.domains = [];
  state.selectedDomainId = null;
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  document.getElementById('usernameLabel').textContent = authUsername || '';
  document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
  // 強制切回儀表板分頁——不能只呼叫 loadDashboard(),因為如果上一個帳號登出前
  // 停在別的分頁(例如獎勵中心),分頁按鈕跟畫面區塊的 active 狀態還留著上次的樣子,
  // 畫面看起來就會「卡在舊分頁」,要點別的分頁再點回來才會恢復正常——這正是你抓到的那個問題
  switchPage('dashboard');
  refreshCoinPill();
  maybeStartTour();
}

  { title: '③ 目標地圖', body: '點這裡切到「目標地圖」,選一個面向後,可以新增長期目標,再往下展開新增中期、短期目標——短期目標底下才能掛每日/每週任務。', target: '.tabs button[data-page="goalmap"]' },
  { title: '④ 今日任務', body: '這裡會把所有面向、今天要做的事彙整在一起。打勾完成任務會拿到金幣,並自動寫進完成紀錄。', target: '.tabs button[data-page="today"]' },
  { title: '⑤ 金幣餘額', body: '簽到、完成任務(+5)、完成整個目標(雙倍+20)都會累積在這裡,右上角隨時看得到目前餘額。', target: '#coinPill' },
  { title: '⑥ 獎勵中心', body: '在這裡自己定義想要的獎勵(例如追一集劇、買杯手搖飲),金幣存夠了就能兌換,把完成的小事變成生活裡真正的獎勵。', target: '.tabs button[data-page="rewards"]' },
];
let tourIndex = 0;

function maybeStartTour() {
  const seen = localStorage.getItem('embright_tour_seen');
  if (!seen) {
    openTour();
  }
}

function openTour() {
  tourIndex = 0;
  document.getElementById('tourBackdrop').classList.add('open');
  document.getElementById('tourCard').classList.add('open');
  renderTourStep();
}

function renderTourStep() {
  const step = TOUR_STEPS[tourIndex];
  document.getElementById('tourStepLabel').textContent = `${tourIndex + 1} / ${TOUR_STEPS.length}`;
  document.getElementById('tourTitle').textContent = step.title;
  document.getElementById('tourBody').textContent = step.body;
  document.getElementById('tourPrevBtn').style.visibility = tourIndex === 0 ? 'hidden' : 'visible';
  document.getElementById('tourNextBtn').textContent = tourIndex === TOUR_STEPS.length - 1 ? '開始使用' : '下一步';
  positionTourVisuals(step);
}

function positionTourVisuals(step) {
  const spotlight = document.getElementById('tourSpotlight');
  const card = document.getElementById('tourCard');
  const arrow = document.getElementById('tourArrow');
  const cardWidth = 300;
  const margin = 16;

  const targetEl = step.target ? document.querySelector(step.target) : null;

  if (!targetEl) {
    // 沒有目標元素(開場/純介紹用):聚光燈關掉,卡片直接放在畫面正中央
    spotlight.classList.remove('open');
    arrow.style.display = 'none';
    const vw = window.innerWidth, vh = window.innerHeight;
    card.style.left = Math.round((vw - cardWidth) / 2) + 'px';
    card.style.top = Math.round(vh / 2 - 90) + 'px';
    return;
  }

  const rect = targetEl.getBoundingClientRect();
  const pad = 6;

  spotlight.classList.add('open');
  spotlight.style.left = (rect.left - pad) + 'px';
  spotlight.style.top = (rect.top - pad) + 'px';
  spotlight.style.width = (rect.width + pad * 2) + 'px';
  spotlight.style.height = (rect.height + pad * 2) + 'px';

  // 卡片優先放在目標下方;如果下方空間不夠,改放上方
  const vw = window.innerWidth, vh = window.innerHeight;
  const spaceBelow = vh - rect.bottom;
  const placeBelow = spaceBelow > 200;

  let left = rect.left + rect.width / 2 - cardWidth / 2;
  left = Math.max(margin, Math.min(left, vw - cardWidth - margin));
  const top = placeBelow ? rect.bottom + 18 : rect.top - 18;

  card.style.left = left + 'px';
  if (placeBelow) {
    card.style.top = top + 'px';
  } else {
    card.style.top = 'auto';
    card.style.bottom = (vh - rect.top + 18) + 'px';
  }
  if (placeBelow) card.style.bottom = 'auto';

  // 箭頭指向目標中心
  arrow.style.display = 'block';
  const arrowLeft = Math.max(16, Math.min(rect.left + rect.width / 2 - left - 7, cardWidth - 24));
  arrow.style.left = arrowLeft + 'px';
  if (placeBelow) {
    arrow.style.top = '-7px';
    arrow.style.bottom = 'auto';
  } else {
    arrow.style.top = 'auto';
    arrow.style.bottom = '-7px';
  }
}

function tourNext() {
  if (tourIndex < TOUR_STEPS.length - 1) {
    tourIndex++;
    renderTourStep();
  } else {
    closeTour();
  }
}

function tourPrev() {
  if (tourIndex > 0) {
    tourIndex--;
    renderTourStep();
  }
}

function skipTour() {
  closeTour();
}

function closeTour() {
  document.getElementById('tourBackdrop').classList.remove('open');
  document.getElementById('tourCard').classList.remove('open');
  document.getElementById('tourSpotlight').classList.remove('open');
  localStorage.setItem('embright_tour_seen', '1');
}

window.addEventListener('resize', () => {
  const card = document.getElementById('tourCard');
  if (card.classList.contains('open')) {
    renderTourStep();
  }
});

// ---------- 初始化 ----------
if (authToken) {
  enterApp();
} else {
  document.getElementById('authScreen').style.display = 'flex';
}
</script>
